org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop/
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# When updating minecraft version is necessary to update:
# fzmm.zailer.me.client.command.argument_type.VersionArgumentType#initVersions

# Mod Properties
mod_version=0.2.21-beta.1
maven_group=zailer.me
archives_base_name=fzmm

# Dependencies
# https://fabricmc.net/develop/
fabric_api_version=0.165.2+26.3
# https://maven.wispforest.io/#/releases/io/wispforest/owo-lib
# NOTE: upstream maven has no 26.3 build; 0.13.1+26.3 is served from the local
# repository in ./local-maven (built from ../owo-lib-0.13.1-26.2)
owo_version=0.13.1+26.3
# https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu
modmenu_version=21.0.0
# https://maven.nucleoid.xyz/eu/pb4/placeholder-api/
placeholder_api_version=3.2.0+26.3

# Optional dependencies
# https://modrinth.com/mod/symbol-chat/versions
symbol_chat_version=1.4.3
symbol_chat_reconfigure_version=0.3.3
# MC 26.3 dropped lwjgl-tinyfd from its library list, so it has to be pulled in explicitly
lwjgl_version=3.4.3